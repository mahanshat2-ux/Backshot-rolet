<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buckshot Roulette - Ultimate Table Edition</title>
    <!-- PeerJS CDN for WebRTC Multiplayer -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #080808;
            --table-color: #1c1815;
            --table-border: #3a2e2b;
            --accent-red: #ff3333;
            --accent-green: #33ff66;
            --accent-gold: #ffcc00;
            --text-color: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .shake {
            animation: shakeAnim 0.3s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shakeAnim {
            10%, 90% { transform: translate3d(-4px, 2px, 0); }
            20%, 80% { transform: translate3d(6px, -4px, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 6px, 0); }
            40%, 60% { transform: translate3d(8px, -6px, 0); }
        }

        #game-container {
            width: 1050px;
            height: 720px;
            background: #050505;
            border: 4px solid #222;
            box-shadow: 0 0 60px rgba(0, 0, 0, 1);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            overflow: hidden;
        }

        /* Scanline Overlay */
        #game-container::after {
            content: " ";
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        .menu-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 8, 8, 0.96);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            gap: 20px;
        }

        .title {
            font-size: 3rem;
            color: var(--accent-red);
            text-shadow: 0 0 15px rgba(255, 51, 51, 0.6);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .btn {
            background: #1c1c1c;
            color: #fff;
            border: 2px solid #444;
            padding: 12px 40px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            width: 260px;
            text-align: center;
            text-transform: uppercase;
        }

        .btn:hover {
            background: var(--accent-red);
            color: #000;
            border-color: var(--accent-red);
            box-shadow: 0 0 15px var(--accent-red);
            font-weight: bold;
        }

        .btn:disabled {
            background: #111;
            color: #555;
            border-color: #333;
            cursor: not-allowed;
            box-shadow: none;
        }

        .input-name {
            background: #111;
            border: 2px solid #444;
            color: #fff;
            padding: 10px 15px;
            font-size: 1.1rem;
            text-align: center;
            width: 260px;
            outline: none;
        }

        .input-name:focus {
            border-color: var(--accent-red);
        }

        .settings-card {
            background: #151515;
            border: 1px solid #333;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 350px;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .room-code-display {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-gold);
            letter-spacing: 4px;
            background: #111;
            padding: 10px 20px;
            border: 1px dashed var(--accent-gold);
            margin: 10px 0;
        }

        /* --- TOP DOWN TABLE DESIGN --- */
        .table-view {
            width: 100%;
            height: 100%;
            background: var(--table-color);
            border: 12px solid var(--table-border);
            border-radius: 40px;
            box-shadow: inset 0 0 80px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 30px;
            position: relative;
        }

        .table-side {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 110px;
        }

        .player-info-card {
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 20px;
            border-radius: 6px;
            border: 1px solid #444;
            min-width: 220px;
        }

        .health-bar {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .hp-node {
            width: 18px;
            height: 25px;
            background: var(--accent-green);
            border: 1px solid #000;
            box-shadow: 0 0 6px var(--accent-green);
            transition: background 0.3s;
        }

        .hp-node.dealer-hp-node {
            background: var(--accent-red);
            box-shadow: 0 0 6px var(--accent-red);
        }

        .hp-node.lost {
            background: #222 !important;
            box-shadow: none !important;
        }

        /* ITEMS ON TABLE */
        .items-mat {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            background: rgba(0,0,0,0.4);
            padding: 8px;
            border-radius: 8px;
            border: 1px dashed #555;
            min-width: 250px;
            min-height: 95px;
        }

        .item-card {
            width: 52px;
            height: 52px;
            background: #2a2421;
            border: 2px solid #55443d;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6rem;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .item-card:hover {
            border-color: #fff;
            transform: scale(1.1);
            background: #3d332e;
        }

        .item-card.disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* CENTER TABLE STAGE */
        .center-table {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .status-box {
            background: #0d0d0d;
            border: 2px solid var(--accent-red);
            padding: 8px 30px;
            color: #fff;
            font-size: 1.2rem;
            border-radius: 4px;
            text-align: center;
            min-width: 320px;
            box-shadow: 0 0 10px rgba(255, 51, 51, 0.3);
        }

        .gun-mat {
            width: 420px;
            height: 100px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #444;
            border-radius: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: inset 0 0 20px #000;
        }

        .shotgun-visual {
            font-size: 1.3rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: #aaa;
            transition: all 0.3s;
        }

        .shotgun-sawed {
            color: var(--accent-red) !important;
            text-shadow: 0 0 10px var(--accent-red);
        }

        .action-bar {
            display: flex;
            gap: 20px;
        }

        .btn-action {
            width: 180px;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="game-container">

        <!-- MAIN MENU -->
        <div id="main-menu" class="menu-overlay">
            <h1 class="title" id="menu-title">BUCKSHOT ROULETTE</h1>
            <input type="text" id="player-name-input" class="input-name" placeholder="نام شما / Your Name" value="بازیکن">
            <button class="btn" id="start-btn" onclick="startGame()">تک‌نفره (VS AI)</button>
            <button class="btn" id="multi-btn" onclick="showMultiplayerMenu()">مولتی‌پلیر (آنلاین)</button>
            <button class="btn" id="opt-btn" onclick="showSettings()">تنظیمات</button>
        </div>

        <!-- MULTIPLAYER SELECTION MENU -->
        <div id="multi-menu" class="menu-overlay hidden">
            <h2 class="title" style="font-size: 2rem;">مولتی‌پلیر آنلاین</h2>
            <button class="btn" onclick="hostGame()">ساخت اتاق (Host)</button>
            <button class="btn" onclick="showJoinInput()">ورود به اتاق (Join)</button>
            
            <div id="join-section" class="hidden" style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
                <input type="text" id="room-code-input" class="input-name" placeholder="کد اتاق را وارد کنید" style="text-transform: uppercase;">
                <button class="btn" onclick="joinGame()">پیوستن به بازی</button>
            </div>

            <button class="btn" onclick="hideMultiplayerMenu()">بازگشت</button>
        </div>

        <!-- LOBBY OVERLAY -->
        <div id="lobby-menu" class="menu-overlay hidden">
            <h2 class="title" style="font-size: 2rem;">اتاق انتظار</h2>
            <div>کد اتاق شما:</div>
            <div id="display-room-code" class="room-code-display">------</div>
            <div id="lobby-status" style="color: #aaa; margin: 10px 0;">در حال اتصال به سرور...</div>
            
            <button class="btn" id="ready-btn" onclick="toggleReady()" class="hidden">آماده نیستم ❌</button>
            <button class="btn" id="host-start-btn" onclick="startMultiplayerGame()" disabled>شروع بازی 🚀</button>
            <button class="btn" onclick="leaveLobby()">خروج از اتاق</button>
        </div>

        <!-- SETTINGS MENU -->
        <div id="settings-menu" class="menu-overlay hidden">
            <h2 class="title" id="settings-title" style="font-size: 2rem;">تنظیمات</h2>
            <div class="settings-card">
                <div class="setting-row">
                    <label id="lbl-volume">صدا:</label>
                    <input type="range" id="volume-slider" min="0" max="100" value="80" onchange="updateVolume(this.value)">
                </div>
                <div class="setting-row">
                    <label id="lbl-language">زبان / Language:</label>
                    <select id="lang-select" onchange="changeLanguage(this.value)" style="padding: 5px; background:#222; color:#fff;">
                        <option value="fa" selected>فارسی</option>
                        <option value="en">English</option>
                    </select>
                </div>
            </div>
            <button class="btn" id="back-btn" onclick="hideSettings()">بازگشت</button>
        </div>

        <!-- TOP-DOWN TABLE INTERFACE -->
        <div class="table-view">
            
            <!-- DEALER / OPPONENT TOP SIDE -->
            <div class="table-side">
                <div class="player-info-card">
                    <h3 id="dealer-name-lbl" style="color: var(--accent-red);">DEALER</h3>
                    <div id="dealer-hp" class="health-bar"></div>
                </div>
                <div id="dealer-items-mat" class="items-mat"></div>
            </div>

            <!-- CENTER TABLE STAGE -->
            <div class="center-table">
                <div id="status-display" class="status-box">نوبت شماست</div>
                
                <div class="gun-mat">
                    <div id="shotgun-text" class="shotgun-visual">🔫 12-GAUGE SHOTGUN</div>
                </div>

                <div id="shells-info" style="display: flex; gap: 20px; font-weight: bold;">
                    <span style="color: var(--accent-red);" id="live-count-txt">تیر پر: 0</span>
                    <span style="color: #888;" id="blank-count-txt">تیر خالی: 0</span>
                </div>
            </div>

            <!-- PLAYER BOTTOM SIDE -->
            <div class="table-side">
                <div id="player-items-mat" class="items-mat"></div>
                <div class="player-info-card">
                    <h3 id="player-name-lbl" style="color: var(--accent-green);">YOU</h3>
                    <div id="player-hp" class="health-bar"></div>
                </div>
            </div>

            <!-- ACTION BUTTONS -->
            <div class="action-bar" style="justify-content: center;">
                <button class="btn btn-action" id="btn-self" style="background: #1a3c40; border-color: #4db8ff;" onclick="playerAction('self')">شلیک به خود</button>
                <button class="btn btn-action" id="btn-dealer" style="background: #8b0000; border-color: #ff4d4d;" onclick="playerAction('dealer')">شلیک به حریف</button>
            </div>

        </div>
    </div>

    <script>
        const i18n = {
            fa: {
                title: "بک‌شات رولت",
                start: "تک‌نفره (VS AI)",
                options: "تنظیمات",
                settings: "تنظیمات",
                volume: "میزان صدا:",
                language: "زبان / Language:",
                back: "بازگشت",
                dealer: "دیلر (Dealer)",
                hp: "جان:",
                shootSelf: "شلیک به خود",
                shootDealer: "شلیک به حریف",
                liveShells: "تیر پر: ",
                blankShells: "تیر خالی: ",
                yourTurn: "نوبت شماست!",
                dealerTurn: "نوبت حریف است...",
                round: "راند ",
                sawUsed: "اره استفاده شد! آسیب بعدی ۲ برابر می‌شود.",
                cigUsed: "سیگار کشیده شد! ۱ جان اضافه شد.",
                beerUsed: "یک گلوله از تفنگ خارج شد: ",
                magnifierUsed: "گلوله جاری: ",
                handcuffsUsed: "دستبند زده شد! نوبت بعدی اسکیپ می‌شود.",
                live: "پر (Live)",
                blank: "خالی (Blank)",
                win: "شما برنده شدید!",
                lose: "شما باختید!",
                selfBlankExtraTurn: "تیر خالی بود! یک نوبت اضافه گرفتید."
            },
            en: {
                title: "BUCKSHOT ROULETTE",
                start: "SINGLE PLAYER",
                options: "OPTIONS",
                settings: "SETTINGS",
                volume: "Volume:",
                language: "Language / زبان:",
                back: "BACK",
                dealer: "OPPONENT",
                hp: "HP:",
                shootSelf: "SHOOT SELF",
                shootDealer: "SHOOT OPPONENT",
                liveShells: "Live: ",
                blankShells: "Blank: ",
                yourTurn: "YOUR TURN",
                dealerTurn: "OPPONENT'S TURN...",
                round: "ROUND ",
                sawUsed: "Saw used! Next shot deals double damage.",
                cigUsed: "Cigarette smoked! Restored 1 HP.",
                beerUsed: "Cycled out a shell: ",
                magnifierUsed: "Current shell is: ",
                handcuffsUsed: "Handcuffs applied! Opponent skips next turn.",
                live: "LIVE",
                blank: "BLANK",
                win: "YOU WIN!",
                lose: "YOU DIED!",
                selfBlankExtraTurn: "Blank shell! You get another turn."
            }
        };

        let currentLang = 'fa';
        let audioVolume = 0.8;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioVolume === 0) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            gain.gain.value = audioVolume;

            if (type === 'shot') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'item') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            }
        }

        let gameState = {
            playerName: "بازیکن",
            round: 1,
            playerHp: 5,
            maxHp: 5,
            dealerHp: 5,
            magazine: [],
            playerItems: [],
            dealerItems: [],
            isPlayerTurn: true,
            isSawed: false,
            isHandcuffed: false,
            isProcessing: false
        };

        // Network & Multiplayer States
        let isMultiplayer = false;
        let isHost = false;
        let peer = null;
        let conn = null;
        let isClientReady = false;

        const ITEMS_DEF = {
            saw: { icon: '🪚', nameFa: 'اره', nameEn: 'Saw' },
            beer: { icon: '🍺', nameFa: 'آبجو', nameEn: 'Beer' },
            cig: { icon: '🚬', nameFa: 'سیگار', nameEn: 'Cigarette' },
            magnifier: { icon: '🔍', nameFa: 'ذره‌بین', nameEn: 'Magnifier' },
            handcuffs: { icon: '🔗', nameFa: 'دستبند', nameEn: 'Handcuffs' }
        };

        function changeLanguage(lang) {
            currentLang = lang;
            document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
            
            document.getElementById('menu-title').innerText = i18n[lang].title;
            document.getElementById('start-btn').innerText = i18n[lang].start;
            document.getElementById('opt-btn').innerText = i18n[lang].options;
            document.getElementById('settings-title').innerText = i18n[lang].settings;
            document.getElementById('lbl-volume').innerText = i18n[lang].volume;
            document.getElementById('lbl-language').innerText = i18n[lang].language;
            document.getElementById('back-btn').innerText = i18n[lang].back;
            document.getElementById('dealer-name-lbl').innerText = isMultiplayer ? "حریف" : i18n[lang].dealer;
            document.getElementById('btn-self').innerText = i18n[lang].shootSelf;
            document.getElementById('btn-dealer').innerText = i18n[lang].shootDealer;
            
            updateShellsUI();
            renderItems();
        }

        function updateVolume(val) { audioVolume = val / 100; }
        function showSettings() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('settings-menu').classList.remove('hidden');
        }
        function hideSettings() {
            document.getElementById('settings-menu').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        }

        // --- MULTIPLAYER MENU LOGIC ---
        function showMultiplayerMenu() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('multi-menu').classList.remove('hidden');
            document.getElementById('join-section').classList.add('hidden');
        }

        function hideMultiplayerMenu() {
            document.getElementById('multi-menu').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        }

        function showJoinInput() {
            document.getElementById('join-section').classList.remove('hidden');
        }

        function initPeer(callback) {
            if (peer) peer.destroy();
            peer = new Peer();
            
            peer.on('open', (id) => {
                if (callback) callback(id);
            });

            peer.on('error', (err) => {
                alert("خطای شبکه: " + err.type);
                leaveLobby();
            });
        }

        function hostGame() {
            isMultiplayer = true;
            isHost = true;
            document.getElementById('multi-menu').classList.add('hidden');
            document.getElementById('lobby-menu').classList.remove('hidden');
            document.getElementById('lobby-status').innerText = "در حال دریافت کد اتاق...";
            document.getElementById('host-start-btn').classList.remove('hidden');
            document.getElementById('ready-btn').classList.add('hidden');

            const name = document.getElementById('player-name-input').value.trim() || "هاست";
            gameState.playerName = name;

            initPeer((id) => {
                const roomCode = id.substring(0, 6).toUpperCase();
                document.getElementById('display-room-code').innerText = roomCode;
                document.getElementById('lobby-status').innerText = "منتظر ورود بازیکن دوم...";
            });

            peer.on('connection', (c) => {
                conn = c;
                setupConnection();
            });
        }

        function joinGame() {
            const code = document.getElementById('room-code-input').value.trim();
            if (!code) return alert("لطفا کد اتاق را وارد کنید.");

            isMultiplayer = true;
            isHost = false;
            document.getElementById('multi-menu').classList.add('hidden');
            document.getElementById('lobby-menu').classList.remove('hidden');
            document.getElementById('lobby-status').innerText = "در حال اتصال به اتاق...";
            document.getElementById('host-start-btn').classList.add('hidden');
            document.getElementById('ready-btn').classList.remove('hidden');

            const name = document.getElementById('player-name-input').value.trim() || "بازیکن ۲";
            gameState.playerName = name;

            initPeer(() => {
                // Discover target peer ID by matching code prefix if possible or connecting directly
                // PeerJS uses direct IDs. For simplicity, we match the prefix:
                peer.listAllPeers((peers) => {
                    const targetId = peers.find(p => p.startsWith(code.toLowerCase()));
                    if (targetId) {
                        conn = peer.connect(targetId);
                        setupConnection();
                    } else {
                        // Fallback try connecting directly using raw code
                        conn = peer.connect(code.toLowerCase());
                        setupConnection();
                    }
                });
            });
        }

        function setupConnection() {
            conn.on('open', () => {
                if (isHost) {
                    document.getElementById('lobby-status').innerText = "بازیکن دوم متصل شد. منتظر اعلام آمادگی (Ready)...";
                    sendData({ type: 'HANDSHAKE', name: gameState.playerName });
                } else {
                    document.getElementById('lobby-status').innerText = "به اتاق متصل شدید!";
                    sendData({ type: 'HANDSHAKE', name: gameState.playerName });
                }
            });

            conn.on('data', (data) => {
                handleNetworkData(data);
            });

            conn.on('close', () => {
                alert("ارتباط با بازیکن مقابل قطع شد.");
                location.reload();
            });
        }

        function toggleReady() {
            isClientReady = !isClientReady;
            const btn = document.getElementById('ready-btn');
            btn.innerText = isClientReady ? "آماده‌ام ✅" : "آماده نیستم ❌";
            sendData({ type: 'READY_STATUS', status: isClientReady });
        }

        function sendData(data) {
            if (conn && conn.open) {
                conn.send(data);
            }
        }

        function handleNetworkData(data) {
            switch (data.type) {
                case 'HANDSHAKE':
                    document.getElementById('dealer-name-lbl').innerText = data.name;
                    break;
                case 'READY_STATUS':
                    if (isHost) {
                        isClientReady = data.status;
                        document.getElementById('lobby-status').innerText = isClientReady ? "بازیکن دوم آماده است!" : "بازیکن دوم ناآماده شد.";
                        document.getElementById('host-start-btn').disabled = !isClientReady;
                    }
                    break;
                case 'START_GAME':
                    document.getElementById('lobby-menu').classList.add('hidden');
                    gameState = data.state;
                    // Adjust perspective for client (Player 2)
                    if (!isHost) {
                        document.getElementById('player-name-lbl').innerText = gameState.playerName;
                        updateUI();
                        setStatus(gameState.isPlayerTurn ? i18n[currentLang].yourTurn : i18n[currentLang].dealerTurn);
                        toggleControls(gameState.isPlayerTurn);
                    }
                    break;
                case 'ACTION_SHOT':
                    executeShot(data.target, data.shooter, true);
                    break;
                case 'ACTION_ITEM':
                    useItem(data.itemId, data.user, true);
                    break;
                case 'SYNC_STATE':
                    syncGameState(data.state);
                    break;
            }
        }

        function leaveLobby() {
            if (peer) peer.destroy();
            isMultiplayer = false;
            document.getElementById('lobby-menu').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        }

        function startMultiplayerGame() {
            if (!isHost || !isClientReady) return;
            document.getElementById('lobby-menu').classList.add('hidden');
            
            gameState.round = 1;
            gameState.playerHp = 5;
            gameState.dealerHp = 5;
            gameState.maxHp = 5;
            gameState.playerItems = [];
            gameState.dealerItems = [];
            
            startRound();
        }

        // --- GAME LOGIC ---
        function startGame() {
            isMultiplayer = false;
            document.getElementById('dealer-name-lbl').innerText = i18n[currentLang].dealer;
            const inputName = document.getElementById('player-name-input').value.trim();
            if (inputName) gameState.playerName = inputName;
            document.getElementById('player-name-lbl').innerText = gameState.playerName;

            document.getElementById('main-menu').classList.add('hidden');
            gameState.round = 1;
            gameState.playerHp = 5;
            gameState.dealerHp = 5;
            gameState.maxHp = 5;
            gameState.playerItems = [];
            gameState.dealerItems = [];
            
            startRound();
        }

        function startRound() {
            gameState.isSawed = false;
            gameState.isHandcuffed = false;
            document.getElementById('shotgun-text').classList.remove('shotgun-sawed');
            
            gameState.magazine = generateMagazine();

            // Item Distribution System
            const itemsToAddCount = (gameState.round === 1) ? 2 : 4;
            addItemsToPlayer('player', itemsToAddCount);
            addItemsToPlayer('dealer', itemsToAddCount);

            updateUI();
            setStatus(i18n[currentLang].round + gameState.round);

            if (isMultiplayer && isHost) {
                // Mirror state for client
                let clientState = JSON.parse(JSON.stringify(gameState));
                // Swap HP and items so client sees themselves at the bottom
                clientState.playerHp = gameState.dealerHp;
                clientState.dealerHp = gameState.playerHp;
                clientState.playerItems = [...gameState.dealerItems];
                clientState.dealerItems = [...gameState.playerItems];
                clientState.isPlayerTurn = !gameState.isPlayerTurn;

                sendData({ type: 'START_GAME', state: clientState });
            }
            
            setTimeout(() => {
                gameState.isPlayerTurn = true;
                gameState.isProcessing = false;
                setStatus(i18n[currentLang].yourTurn);
                toggleControls(true);
            }, 1200);
        }

        function syncGameStateToClient() {
            if (!isMultiplayer || !isHost) return;
            let clientState = JSON.parse(JSON.stringify(gameState));
            clientState.playerHp = gameState.dealerHp;
            clientState.dealerHp = gameState.playerHp;
            clientState.playerItems = [...gameState.dealerItems];
            clientState.dealerItems = [...gameState.playerItems];
            clientState.isPlayerTurn = !gameState.isPlayerTurn;

            sendData({ type: 'SYNC_STATE', state: clientState });
        }

        function syncGameState(newState) {
            gameState.playerHp = newState.playerHp;
            gameState.dealerHp = newState.dealerHp;
            gameState.magazine = newState.magazine;
            gameState.playerItems = newState.playerItems;
            gameState.dealerItems = newState.dealerItems;
            gameState.isPlayerTurn = newState.isPlayerTurn;
            gameState.isSawed = newState.isSawed;
            gameState.isHandcuffed = newState.isHandcuffed;
            
            updateUI();
            toggleControls(gameState.isPlayerTurn);
            setStatus(gameState.isPlayerTurn ? i18n[currentLang].yourTurn : i18n[currentLang].dealerTurn);
        }

        function addItemsToPlayer(target, count) {
            const keys = Object.keys(ITEMS_DEF);
            const currentItems = target === 'player' ? gameState.playerItems : gameState.dealerItems;
            
            for (let i = 0; i < count; i++) {
                if (currentItems.length < 8) { // Max 8 items limit
                    const randKey = keys[Math.floor(Math.random() * keys.length)];
                    currentItems.push(randKey);
                }
            }
        }

        function generateMagazine() {
            const total = Math.floor(Math.random() * 5) + 3; // 3 to 7 shells
            let lives = Math.floor(Math.random() * (total - 1)) + 1;
            let blanks = total - lives;
            
            let mag = [];
            for (let i = 0; i < lives; i++) mag.push('live');
            for (let i = 0; i < blanks; i++) mag.push('blank');
            
            return mag.sort(() => Math.random() - 0.5);
        }

        function triggerScreenShake() {
            const container = document.getElementById('game-container');
            container.classList.add('shake');
            setTimeout(() => container.classList.remove('shake'), 300);
        }

        function playerAction(target) {
            if (gameState.isProcessing || !gameState.isPlayerTurn) return;
            gameState.isProcessing = true;
            toggleControls(false);

            if (isMultiplayer) {
                // Map target for network opponent
                const remoteTarget = target === 'self' ? 'dealer' : 'self';
                sendData({ type: 'ACTION_SHOT', target: remoteTarget, shooter: 'dealer' });
            }

            executeShot(target, 'player');
        }

        function executeShot(target, shooter, isNetworkEvent = false) {
            const currentShell = gameState.magazine.shift();
            const damage = gameState.isSawed ? 2 : 1;
            gameState.isSawed = false;
            document.getElementById('shotgun-text').classList.remove('shotgun-sawed');

            const oppLabel = isMultiplayer ? "حریف" : "دیلر";

            if (currentShell === 'live') {
                playSound('shot');
                triggerScreenShake();

                if (target === 'dealer') {
                    gameState.dealerHp = Math.max(0, gameState.dealerHp - damage);
                    setStatus(shooter === 'player' ? `به ${oppLabel} شلیک کردید! (شلیک موفق)` : `${oppLabel} به خود شلیک کرد! (آسیب دید)`);
                } else {
                    gameState.playerHp = Math.max(0, gameState.playerHp - damage);
                    setStatus(shooter === 'player' ? "به خودتان شلیک کردید!" : `${oppLabel} به شما شلیک کرد!`);
                }

                updateUI();
                if (isMultiplayer && isHost) syncGameStateToClient();

                if (checkGameOver()) return;

                setTimeout(() => {
                    handleTurnSwitch(shooter, false);
                }, 1400);

            } else { // Blank Shell
                playSound('click');
                setStatus("کلیک... (تیر پوچ بود)");
                updateUI();
                if (isMultiplayer && isHost) syncGameStateToClient();

                setTimeout(() => {
                    if (target === 'self') {
                        setStatus(i18n[currentLang].selfBlankExtraTurn);
                        setTimeout(() => {
                            if (shooter === 'player') {
                                gameState.isPlayerTurn = true;
                                toggleControls(true);
                                gameState.isProcessing = false;
                            } else {
                                if (!isMultiplayer) dealerLogic();
                            }
                        }, 1200);
                    } else {
                        handleTurnSwitch(shooter, true);
                    }
                }, 1200);
            }
        }

        function handleTurnSwitch(shooter, wasBlank) {
            if (gameState.magazine.length === 0) {
                setStatus("خشاب خالی شد. راند جدید...");
                gameState.round++;
                setTimeout(startRound, 1500);
                return;
            }

            if (gameState.isHandcuffed) {
                gameState.isHandcuffed = false;
                setStatus("به دلیل دستبند، نوبت اسکیپ شد!");
                setTimeout(() => {
                    if (shooter === 'player') {
                        gameState.isPlayerTurn = true;
                        toggleControls(true);
                        gameState.isProcessing = false;
                    } else {
                        if (!isMultiplayer) dealerLogic();
                    }
                }, 1200);
                return;
            }

            if (shooter === 'player') {
                gameState.isPlayerTurn = false;
                setStatus(i18n[currentLang].dealerTurn);
                if (!isMultiplayer) setTimeout(dealerLogic, 1500);
            } else {
                gameState.isPlayerTurn = true;
                setStatus(i18n[currentLang].yourTurn);
                toggleControls(true);
                gameState.isProcessing = false;
            }

            if (isMultiplayer && isHost) syncGameStateToClient();
        }

        function dealerLogic() {
            gameState.isProcessing = true;

            // AI Item Usage Strategy
            if (gameState.dealerItems.length > 0) {
                const itemToUse = gameState.dealerItems[0];
                if (itemToUse === 'saw' && !gameState.isSawed) {
                    useItem('saw', 'dealer');
                    setTimeout(dealerLogic, 1000);
                    return;
                } else if (itemToUse === 'cig' && gameState.dealerHp < gameState.maxHp) {
                    useItem('cig', 'dealer');
                    setTimeout(dealerLogic, 1000);
                    return;
                }
            }

            const liveCount = gameState.magazine.filter(s => s === 'live').length;
            const totalCount = gameState.magazine.length;
            const liveRatio = liveCount / totalCount;

            if (liveRatio <= 0.3) {
                executeShot('self', 'dealer');
            } else {
                executeShot('player', 'dealer');
            }
        }

        function useItem(itemId, user, isNetworkEvent = false) {
            playSound('item');
            
            if (isMultiplayer && !isNetworkEvent && user === 'player') {
                sendData({ type: 'ACTION_ITEM', itemId: itemId, user: 'dealer' });
            }

            let itemsArr = user === 'player' ? gameState.playerItems : gameState.dealerItems;
            let index = itemsArr.indexOf(itemId);
            if (index > -1) itemsArr.splice(index, 1);

            if (itemId === 'saw') {
                gameState.isSawed = true;
                document.getElementById('shotgun-text').classList.add('shotgun-sawed');
                setStatus(i18n[currentLang].sawUsed);
            } else if (itemId === 'cig') {
                if (user === 'player') gameState.playerHp = Math.min(gameState.maxHp, gameState.playerHp + 1);
                else gameState.dealerHp = Math.min(gameState.maxHp, gameState.dealerHp + 1);
                setStatus(i18n[currentLang].cigUsed);
            } else if (itemId === 'beer') {
                const discarded = gameState.magazine.shift();
                setStatus(i18n[currentLang].beerUsed + (discarded === 'live' ? i18n[currentLang].live : i18n[currentLang].blank));
            } else if (itemId === 'magnifier') {
                const nextShell = gameState.magazine[0];
                setStatus(i18n[currentLang].magnifierUsed + (nextShell === 'live' ? i18n[currentLang].live : i18n[currentLang].blank));
            } else if (itemId === 'handcuffs') {
                gameState.isHandcuffed = true;
                setStatus(i18n[currentLang].handcuffsUsed);
            }

            updateUI();
            if (isMultiplayer && isHost) syncGameStateToClient();

            if (gameState.magazine.length === 0) {
                setTimeout(() => {
                    setStatus("خشاب خالی شد. راند جدید...");
                    gameState.round++;
                    startRound();
                }, 1500);
            }
        }

        function updateUI() {
            renderHealth('player-hp', gameState.playerHp, gameState.maxHp, false);
            renderHealth('dealer-hp', gameState.dealerHp, gameState.maxHp, true);
            updateShellsUI();
            renderItems();
        }

        function renderHealth(elementId, current, max, isDealer) {
            const container = document.getElementById(elementId);
            container.innerHTML = '';
            for (let i = 0; i < max; i++) {
                const node = document.createElement('div');
                node.className = 'hp-node' + (isDealer ? ' dealer-hp-node' : '') + (i >= current ? ' lost' : '');
                container.appendChild(node);
            }
        }

        function updateShellsUI() {
            const lives = gameState.magazine.filter(s => s === 'live').length;
            const blanks = gameState.magazine.filter(s => s === 'blank').length;
            
            document.getElementById('live-count-txt').innerText = i18n[currentLang].liveShells + lives;
            document.getElementById('blank-count-txt').innerText = i18n[currentLang].blankShells + blanks;
        }

        function renderItems() {
            const pContainer = document.getElementById('player-items-mat');
            const dContainer = document.getElementById('dealer-items-mat');
            pContainer.innerHTML = '';
            dContainer.innerHTML = '';

            // Render Player Items
            gameState.playerItems.forEach((itemId) => {
                const itemObj = ITEMS_DEF[itemId];
                const card = document.createElement('div');
                card.className = 'item-card';
                card.title = currentLang === 'fa' ? itemObj.nameFa : itemObj.nameEn;
                card.innerText = itemObj.icon;

                card.onclick = () => {
                    if (gameState.isPlayerTurn && !gameState.isProcessing) {
                        useItem(itemId, 'player');
                    }
                };
                pContainer.appendChild(card);
            });

            // Render Dealer Items
            gameState.dealerItems.forEach((itemId) => {
                const itemObj = ITEMS_DEF[itemId];
                const card = document.createElement('div');
                card.className = 'item-card disabled';
                card.innerText = itemObj.icon;
                dContainer.appendChild(card);
            });
        }

        function setStatus(msg) {
            document.getElementById('status-display').innerText = msg;
        }

        function toggleControls(enable) {
            document.getElementById('btn-self').disabled = !enable;
            document.getElementById('btn-dealer').disabled = !enable;
            document.getElementById('btn-self').style.opacity = enable ? '1' : '0.4';
            document.getElementById('btn-dealer').style.opacity = enable ? '1' : '0.4';
        }

        function checkGameOver() {
            if (gameState.playerHp <= 0) {
                setStatus(i18n[currentLang].lose);
                setTimeout(() => document.getElementById('main-menu').classList.remove('hidden'), 2500);
                return true;
            }
            if (gameState.dealerHp <= 0) {
                setStatus(i18n[currentLang].win);
                setTimeout(() => document.getElementById('main-menu').classList.remove('hidden'), 2500);
                return true;
            }
            return false;
        }

        changeLanguage('fa');
    </script>
</body>
